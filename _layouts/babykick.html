<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>{{ page.title | escape }}</title>
<style>
:root{color-scheme:light;--page:#fff;--ink:#3c2633;--muted:#715c68;--link:#a13f64;--wash:#f7edf2;--rule:#e5d3dd}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:1.0625rem/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.reading{width:min(100% - 2.5rem,74ch);margin:2rem auto 5rem;border-top:.25rem solid var(--link);padding-top:1rem}h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.2;overflow-wrap:anywhere}h1{font-size:clamp(2rem,4vw,3rem);margin:1.75rem 0 1rem}h2{font-size:1.5rem;margin:2.4rem 0 .8rem}p{margin:1rem 0}a{color:var(--link);text-decoration-thickness:.08em;text-underline-offset:.17em;overflow-wrap:anywhere}a:hover{background:var(--wash)}a:focus-visible{outline:3px solid var(--link);outline-offset:4px;background:var(--wash)}strong{font-weight:700}p:first-child{font-size:.95rem;color:var(--muted)}p:last-child{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--rule)}@media(max-width:450px){.reading{width:calc(100% - 2rem);margin-top:1rem}body{font-size:1rem}}@media print{.reading{width:100%;max-width:none;margin:0;border:0}a{color:inherit}h2{break-after:avoid}}
</style>
</head>
<body><main class="reading">{{ content }}</main></body>
</html>
